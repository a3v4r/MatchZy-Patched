name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Run unit tests
        run: dotnet test tests/MatchZy.Tests -c Release

      - name: Build and Package
        run: |
          MATCHZY_VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' MatchZy.cs)
          if [ -z "$MATCHZY_VERSION" ]; then MATCHZY_VERSION="0.9.2-patched.1"; fi
          echo "MATCHZY_VERSION=$MATCHZY_VERSION" >> $GITHUB_ENV
          
          echo "Creating MatchZy package v$MATCHZY_VERSION"
          
          # Create folder structure
          mkdir -p package/addons/counterstrikesharp/plugins/MatchZy
          mkdir -p package/cfg/MatchZy
          
          # Publish plugin
          dotnet publish MatchZy.csproj -c Release -o publish
          
          # Copy binaries
          cp -r publish/* package/addons/counterstrikesharp/plugins/MatchZy/
          
          # Remove API DLL (prevents conflicts)
          rm -f package/addons/counterstrikesharp/plugins/MatchZy/CounterStrikeSharp.API.dll
          
          # Copy config files (server data files are created by the plugin when missing)
          if [ -d "cfg/MatchZy" ]; then
            cp -r cfg/MatchZy/* package/cfg/MatchZy/
          fi
          rm -f package/cfg/MatchZy/admins.json package/cfg/MatchZy/database.json package/cfg/MatchZy/savednades.json package/cfg/MatchZy/whitelist.cfg

          # Gamedata (signatures/offsets used by MatchZy since 0.9.0)
          mkdir -p package/addons/counterstrikesharp/gamedata
          cp gamedata/matchzy.json package/addons/counterstrikesharp/gamedata/
          
          # Zip it
          cd package && zip -r ../MatchZy-$MATCHZY_VERSION.zip * && cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchZy-Package
          path: MatchZy-*.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: MatchZy ${{ env.MATCHZY_VERSION }}
          tag_name: ${{ env.MATCHZY_VERSION }}
          files: MatchZy-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
